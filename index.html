<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felicitaciones Graduación en Derecho</title>
    <link rel="stylesheet" href="estilo.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tarjeta" id="tarjeta">
        <div class="estrellas" aria-hidden="true"></div>
        <div class="sello">🎓</div>
        <h1 class="titulo">¡Felicitaciones!</h1>
        <div class="linea"></div>
        <p class="subtitulo">Has alcanzado un gran logro:</p>
        <h2 class="nombre">Tu título en <span>Derecho</span></h2>
        <p class="mensaje">
            Hoy cierras un capítulo lleno de esfuerzo y dedicación.
            Que la justicia y la sabiduría acompañen cada paso de tu brillante camino.
        </p>
        <div class="seccion">
            <span class="icono">⚖️</span>
            <p class="texto-seccion">Que defiendas la verdad y la justicia con pasión.</p>
        </div>
        <button class="boton" id="botonSobres">🎉 Sorpréndeme</button>
        <p class="pie">Con mucho orgullo y cariño para ti</p>
    </div>

    <div class="confeti" id="confeti" aria-hidden="true"></div>

    <script src="funciones.js"></script>
</body>
</html>
